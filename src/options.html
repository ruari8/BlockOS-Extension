<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Site Budget Blocker</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Personal blocker</p>
          <h1>Daily site budgets</h1>
        </div>
        <p id="today" class="muted"></p>
      </header>
      <p id="statusMessage" class="status" hidden></p>

      <section class="panel">
        <div class="section-heading">
          <div>
            <h2>Active today</h2>
            <p class="muted">Fixed limits. No resets, no edits.</p>
          </div>
        </div>
        <div id="activeRules" class="rule-list"></div>
      </section>

      <section class="panel">
        <div class="section-heading">
          <div>
            <h2>Chase a loss</h2>
            <p class="muted" id="usernameStatus"></p>
          </div>
        </div>
        <form id="usernameForm" class="actions">
          <input id="usernameInput" type="text" placeholder="Chess.com username" spellcheck="false" autocomplete="off">
          <button type="submit">Save for tomorrow</button>
        </form>
      </section>
    </main>

    <template id="activeRuleTemplate">
      <article class="rule-card">
        <div>
          <h3 data-field="pattern"></h3>
          <p class="muted" data-field="status"></p>
        </div>
        <div class="usage">
          <strong data-field="used"></strong>
          <span data-field="limit"></span>
        </div>
      </article>
    </template>

    <script src="shared.js" defer></script>
    <script src="options.js" defer></script>
  </body>
</html>
